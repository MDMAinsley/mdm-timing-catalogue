name: Catalogue tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover
      - run: python validate_snapshot.py playback-snapshot.json
      - run: python -c "from pathlib import Path; from review_workflow import validate_bundle; validate_bundle('.') if Path('catalogue-release.json').exists() else None"
